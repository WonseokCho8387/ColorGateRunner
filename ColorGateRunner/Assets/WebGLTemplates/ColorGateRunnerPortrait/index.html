<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Color Gate Runner</title>
    <style>
      :root {
        color-scheme: dark;
        background: #111018;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111018;
      }

      #portrait-frame {
        position: absolute;
        inset: 0;
        width: min(100vw, 56.25vh);
        height: min(100vh, 177.7777778vw);
        margin: auto;
        overflow: hidden;
        aspect-ratio: 9 / 16;
        background: #0b0a10;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: {{{ BACKGROUND_COLOR }}};
      }

      #loading-status {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4%;
        color: #ffffff;
        font-family: sans-serif;
        font-size: 14px;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main id="portrait-frame">
      <canvas
        id="unity-canvas"
        width={{{ WIDTH }}}
        height={{{ HEIGHT }}}
        tabindex="-1"></canvas>
      <div id="loading-status">Loading 0%</div>
    </main>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingStatus = document.querySelector("#loading-status");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, (progress) => {
        loadingStatus.textContent =
          "Loading " + Math.round(progress * 100) + "%";
      }).then(() => {
        loadingStatus.remove();
      }).catch((message) => {
        loadingStatus.textContent = message;
      });
    </script>
  </body>
</html>
